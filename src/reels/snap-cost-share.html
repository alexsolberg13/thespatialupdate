    { c:[-110,48], z:2.2, fit:[[-168.1,54.6],[-141.0,71.4],[-160.4,18.8],[-154.7,22.3],[-66.9,49.4],[-80.0,24.5],[-124.8,24.5]], date:"FY2025 rates",
      kicker:"Highest rates", title:"Alaska leads at 23.15%",
      sub:"Next: D.C. at 18.66%, New Mexico at 16.81%",
      mode:"hl", hl:["AK","DC","NM"], dc:true, legend:[], lbl:["AK","NM","DC"] },

    { c:[-110,48], z:2.2, fit:[[-168.1,54.6],[-141.0,71.4],[-160.4,18.8],[-154.7,22.3],[-66.9,49.4],[-80.0,24.5],[-124.8,24.5]], date:"FY2025 rates",
      kicker:"Delayed start", title:"Seven places are at 13.33% or more",
      sub:"The highest rates can get extra time to start paying",
      mode:"hl", hl:["AK","DE","DC","GA","IL","NM","OR"], dc:true, legend:["late"], lbl:["AK","OR","NM","IL","GA","DE","DC"], short:true },

    { c:[-96,38], z:3.2, fit:[[-124.8,24.5],[-66.9,49.4],[-124.8,49.4],[-80.0,24.5],[-69.0,47.4]], date:"FY2025 rates",
      kicker:"Under the line", title:"Nine states are under 6%",
      sub:"South Dakota is lowest at 2.47%",
      mode:"hl", hl:["ID","IA","KY","NE","SD","UT","VT","WI","WY"], legend:["under"], lbl:["SD"] },

    { c:[-96,38], z:3.2, fit:[[-124.8,24.5],[-66.9,49.4],[-124.8,49.4],[-80.0,24.5],[-69.0,47.4]], date:"FY2025 rates",
      kicker:"Not final", title:"Payments start in fiscal 2028",
      sub:"A state can use its 2025 or 2026 rate",
      mode:"tiers", legend:["t5","t10","t15"], lbl:[] }
  ];

  // ---- State ----------------------------------------------------------------
  var idx = 0;
  var map = null;
  var labelEls = {};
  var layersReady = false;

  var el = {
    date:    document.getElementById("tsu-date"),
    dots:    document.getElementById("tsu-dots"),
    kicker:  document.getElementById("tsu-kicker"),
    title:   document.getElementById("tsu-title"),
    sub:     document.getElementById("tsu-sub"),
    legRows: Array.prototype.slice.call(document.querySelectorAll(".reel-leg-row"))
  };
  var dotsUI = TSUReel.dots(el.dots, BEATS.length);

  // ---- Map ------------------------------------------------------------------
  var TIER_COLOR = ["match", ["get","tier"], 0, COL.blue, 5, COL.gold, 10, COL.orange, 15, COL.red, COL.slate];
  function colorExpr(b) {
    if (b.mode === "split") return ["case", ["==", ["get","tier"], 0], COL.blue, COL.orange];
    return TIER_COLOR;
  }
  function opacityExpr(b) {
    if (b.mode === "split") return 0.6;
    if (b.mode === "tiers") return ["case", ["==", ["get","tier"], 0], 0.22, 0.62];
    return ["case", ["in", ["get","usps"], ["literal", b.hl]], 0.7, 0.1];
  }

  function initMap() {
    if (!window.maplibregl) { setTimeout(initMap, 120); return; }
    var div = document.getElementById("tsu-map");
    if (!div || map) return;

    var b0 = BEATS[0];
    map = new maplibregl.Map(TSUReel.mapOptions(div, { style: STYLE, center: b0.c, zoom: b0.z }));

    map.on("style.load", function () {
      try { map.setProjection({ type: "globe" }); } catch (e) {}
      try {
        map.setSky({
          "sky-color":"#0a1019", "horizon-color":"#1a2436", "fog-color":"#0d1420",
          "sky-horizon-blend":0.5, "horizon-fog-blend":0.6, "fog-ground-blend":0.4
        });
      } catch (e) {}
      buildLayers();
      buildMarkers();
      // The basemap's country names would sit under the reel's own labels.
      ["place_country_1", "place_country_2"].forEach(function (id) {
        try { map.setLayoutProperty(id, "visibility", "none"); } catch (e) {}
      });
      TSUReel.attachMap(map);
      TSUReel.solveAll(map, BEATS);
      applyBeat(idx, false);
    });
  }

  function featuresOfKind(kind) {
    return { type:"FeatureCollection", features: DATA.features.filter(function (f) { return f.properties.kind === kind; }) };
  }

  function buildLayers() {
    map.addSource("states", { type:"geojson", data: featuresOfKind("state") });
    map.addLayer({ id:"states-fill", type:"fill", source:"states",
      paint:{ "fill-color":COL.slate, "fill-opacity":0 } });
    map.addLayer({ id:"states-line", type:"line", source:"states",
      paint:{ "line-color":"#cfcac2", "line-width":0.8, "line-opacity":0 } });
    // Washington, D.C. is too small to see at this zoom, so it gets a ring on the beats that name it.
    map.addSource("dc", { type:"geojson", data:{ type:"Feature", properties:{}, geometry:{ type:"Point", coordinates:[-77.037,38.907] } } });
    map.addLayer({ id:"dc-ring", type:"circle", source:"dc",
      paint:{ "circle-radius":6, "circle-color":COL.red, "circle-opacity":0,
              "circle-stroke-color":"#f2efe9", "circle-stroke-width":2, "circle-stroke-opacity":0 } });
    layersReady = true;
  }

  function buildMarkers() {
    Object.keys(LABELS).forEach(function (k) {
      var d = document.createElement("div");
      d.className = "reel-maplabel tsu-lbl";   // the frame hides it under the text block
      new maplibregl.Marker({ element: d }).setLngLat(ANCHOR[k]).addTo(map);
      labelEls[k] = d;
    });
  }

  function applyBeat(i, fly) {
    var b = BEATS[i];
    if (map) {
      var cam = b.cam || { center: b.c, zoom: b.z };   // solved by the frame so the subject sits in the map window
      if (fly) map.flyTo({ center: cam.center, zoom: cam.zoom, duration: 1600, essential: true, curve: 1.3 });
      else     map.jumpTo({ center: cam.center, zoom: cam.zoom });
    }
    if (layersReady) {
      map.setPaintProperty("states-fill", "fill-color", colorExpr(b));
      map.setPaintProperty("states-fill", "fill-opacity", opacityExpr(b));
      map.setPaintProperty("states-line", "line-opacity", 0.45);
      map.setPaintProperty("dc-ring", "circle-opacity", b.dc ? 0.9 : 0);
      map.setPaintProperty("dc-ring", "circle-stroke-opacity", b.dc ? 1 : 0);
    }
    Object.keys(labelEls).forEach(function (k) {
      var L = LABELS[k];
      // beats with `short` show the two-letter abbreviation only
      labelEls[k].innerHTML = (b.short ? L.s : L.a) + (L.r && !b.short ? "<small>" + L.r + "</small>" : "");
      labelEls[k].classList.toggle("on", b.lbl.indexOf(k) !== -1);
    });
    el.legRows.forEach(function (row) {
      var k = row.getAttribute("data-line");
      row.classList.toggle("on", b.legend.indexOf(k) !== -1);
    });
  }

  // ---- Overlay --------------------------------------------------------------
  function render() {
    var b = BEATS[idx];
    var last = BEATS.length - 1;

    el.kicker.textContent = b.kicker || "";
    el.title.textContent  = b.title || "";
    el.sub.textContent    = b.sub || "";

    var showDate = SHOW_DATE && !!b.date;
    el.date.hidden = !showDate;
    el.date.textContent = showDate ? b.date : "";

    TSUReel.setCounter(idx === 0 ? "Cold open" : ("Beat " + idx + " / " + last));

    dotsUI.set(idx);
  }

  function step(dir) {
    var i = idx + dir;
    if (i >= BEATS.length) i = 0;
    if (i < 0) i = 0;
    idx = i;
    render();
    applyBeat(idx, true);
  }

  render();
  initMap();

  TSUReel.bind({
    count: BEATS.length,
    step: step,
    jump: function (i) { idx = i; render(); applyBeat(idx, false); },
    mapReady: function () { return !!map && map.loaded(); },
    map: function () { return map; },
    beat: function () { return BEATS[idx]; }
  });
})();
</script>
</body>
