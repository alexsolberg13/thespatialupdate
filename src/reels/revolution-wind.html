<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Home Screen web app: opened from the icon it runs full screen, with no browser bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSU Studio">
<meta name="theme-color" content="#0a0f18">
<!-- Shown on the reels index, which lists reels newest first. -->
<meta name="tsu-published" content="2026-08-11">
<title>Story Beat Reel — Revolution Wind · The Spatial Update</title>

<!--
  Story Beat Reel — a 9:16, screen-recordable map reel of "Revolution Wind."
  Standalone page: token-free MapLibre GL + Carto dark-matter tiles, so it renders
  (and records) anywhere. No build step, no Mapbox token. Open it in a browser and
  screen-record the phone screen at 9:16 while narrating.

  Layout: this reel uses the shared frame (reel-frame.css + reel-frame.js): one
  fixed 1080x1920 stage, scaled to fit the screen, with the safe zone and the
  layout bands (header row, map window, legend, text block) defined once in
  reel-frame.css. Add ?guides=1 (or press G) to shade the blocked areas, outline
  the safe area and mark the bands. `npm run check-reels` fails if any beat breaks
  the layout rules. Each beat's `fit` lists the points of its subject; the frame
  zooms and positions the map so they sit inside the map window.

  Controls: tap/click the right ~2/3 of the screen (or press -> / Space) to
  advance a beat, the left ~1/3 (or <-) to go back. Hold a finger down for a second
  to go back to the reels index. Nothing else is ever drawn on screen.

  Pins, the lease polygon, and turbine points mirror src/stories/revolution-wind/
  data.geojson (itself pulled from BOEM's official ArcGIS GIS services — see
  dossiers/revolution-wind.md, "GIS verification pass"). Keep them in sync if the
  story data changes. Coordinates here are [lng, lat] to match MapLibre / GeoJSON.

  This story's spine is a LEASE POLYGON (the law) with a TURBINE FIELD inside it
  (the built object) — new to this reel format vs. lobito-corridor.html (rail
  lines) and august-2026-eclipse.html (a path band). The lease polygon reuses the
  eclipse reel's filled-band technique; the turbine field is a new small dots
  layer (see buildDots()) since no earlier reel needed a scattered point field.
  The turbine positions are BOEM's filed "Option 1" candidate set — see the C21
  flag in the dossier before treating them as confirmed as-built coordinates.
-->

<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

<link href="reel-frame.css" rel="stylesheet">
</head>
<body>
<div class="reel-stage" id="reel-stage">
  <div id="tsu-map"></div>

  <div class="reel-scrim"></div>

  <div class="reel-header">
    <div class="reel-date" id="tsu-date" hidden></div>
    <div class="reel-dots" id="tsu-dots"></div>
  </div>

  <div class="reel-legend" id="tsu-legend">
    <div class="reel-leg-row" data-line="band"><span class="reel-leg-fill" style="background:#5b9bd5"></span>Federal lease OCS-A 0486</div>
    <div class="reel-leg-row" data-line="turbines"><span class="reel-leg-dot" style="background:#e8c87a"></span>Turbines (65)</div>
  </div>

  <div class="reel-caption">
    <div class="reel-kicker" id="tsu-kicker"></div>
    <div class="reel-title"  id="tsu-title"></div>
    <div class="reel-sub"    id="tsu-sub"></div>
  </div>
</div>

<script src="reel-frame.js"></script>
<script>
(function () {
  "use strict";

  // ---- Story data (mirrors src/stories/revolution-wind/) --------------------
  var STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
  var COL = { gold:"#e8c87a", red:"#e05a4e", teal:"#3ecfb2", blue:"#5b9bd5", slate:"#9a958c" };

  // Pins are [lng, lat] — GeoJSON / MapLibre order.
  // Colour codes the narrative: blue = the lease/legal object, gold = the built
  // project once it's standing, teal = shore infrastructure, red = the four
  // sibling projects hit by the same December 2025 order.
  var PINS = {
    revwind:    { lng:-71.06998, lat:41.14994, color:"gold" },   // lease centroid / the project itself
    landfall:   { lng:-71.42619, lat:41.58497, color:"teal" },   // Quonset Point cable landfall
    coastalva:  { lng:-75.559,   lat:36.901,   color:"red"  },   // BOEM lease bbox midpoint (approx)
    empire:     { lng:-73.340,   lat:40.288,   color:"red"  },   // BOEM lease bbox midpoint (approx)
    sunrise:    { lng:-71.796,   lat:40.874,   color:"red"  },   // BOEM lease bbox midpoint (approx)
    vineyard:   { lng:-70.499,   lat:41.250,   color:"red"  }    // BOEM lease bbox midpoint (approx)
  };

  // Lease polygon — main ring only (the small detached parcel northeast of the
  // main block is omitted here for reel simplicity; see the full MultiPolygon
  // in src/stories/revolution-wind/data.geojson). Pulled from BOEM's official
  // Wind Lease Boundaries GIS service, LEASE_NUMBER = OCS-A 0486.
  var BAND = { color:COL.blue, op:0.16, coords:[[
    [-71.120143,41.263721],[-71.061350,41.216150],[-71.045361,41.162393],
    [-71.014906,41.070864],[-70.945614,41.174930],[-70.830021,41.133590],
    [-70.829421,41.111982],[-70.942902,41.083101],[-70.985411,41.071567],
    [-71.006660,41.065795],[-71.042345,41.065168],[-71.071060,41.070059],
    [-71.072248,41.107868],[-71.108127,41.112622],[-71.150976,41.111829],
    [-71.200963,41.110885],[-71.199701,41.073079],[-71.213974,41.072805],
    [-71.228613,41.083331],[-71.228978,41.094133],[-71.250394,41.093717],
    [-71.259756,41.158384],[-71.238688,41.169604],[-71.204219,41.208099],
    [-71.190277,41.213773],[-71.176150,41.224846],[-71.162555,41.246719],
    [-71.148775,41.263190],[-71.134987,41.279659],[-71.120493,41.274523],
    [-71.120143,41.263721]
  ]] };

  // Turbine field — a sampled subset (17 of 65) of BOEM's official "Option 1"
  // candidate positions, enough to read as a field of dots at reel scale
  // without cluttering a 298px-wide frame. Full 65-point set lives in the
  // story's data.geojson. Flag from the dossier still applies: it's not
  // confirmed "Option 1" matches the as-built layout.
  var DOTS = { turbines: { color:COL.gold, radius:2.5, op:0.85, coords:[
    [-71.17278,41.22592],[-71.12864,41.22673],[-71.06272,41.22794],
    [-71.19411,41.20881],[-71.10625,41.21048],[-71.06230,41.21127],
    [-71.21573,41.19174],[-71.14973,41.19299],[-71.10598,41.19376],
    [-71.19323,41.17549],[-71.12704,41.17683],[-71.19129,41.15882],
    [-71.10531,41.16056],[-71.03829,41.16160],[-71.08066,41.12755],
    [-71.03706,41.12753],[-70.90500,41.13057]
  ] } };

  var params = new URLSearchParams(window.location.search);
  var SHOW_DATE = params.get("date") !== "off";

  // Each beat: c / z = the map centre [lng, lat] and the closest zoom it may use;
  // fit = the points of the beat's subject, which the frame fits inside the map
  // window (it zooms out below z if it has to); act = the pin that pulses; lines =
  // which of "band" / "turbines" are drawn, and the legend shows a row for each.
  // On-screen text: a kicker, a headline (7 words), one supporting line (10 words).
  // fit points: the lease's bounding box [W,S] to [E,N]; for the coastwide beats,
  // the five projects' pins.
  var BEATS = [
    { c:[-71.25,41.30], z:7.6, fit:[[-71.2598,41.0652],[-70.8294,41.2797]],
      kicker:"The Spatial Update · Story", title:"Revolution Wind",
      sub:"A federal lease line the government tried to erase, twice",
      vis:["revwind"], act:"revwind", lines:[] },

    { c:[-71.07,41.16], z:9.0, fit:[[-71.2598,41.0652],[-70.8294,41.2797]], date:"Leased 10/1/2013",
      kicker:"The law", title:"A line drawn on water",
      sub:"2013: BOEM leased 83,789 acres off Rhode Island",
      vis:["revwind"], act:"revwind", lines:["band"] },

    { c:[-71.07,41.16], z:9.0, fit:[[-71.2598,41.0652],[-70.8294,41.2797]],
      kicker:"The built object", title:"65 turbines, standing",
      sub:"704 megawatts, enough for more than 350,000 homes",
      vis:["revwind"], act:null, lines:["band","turbines"] },

    { c:[-71.07,41.16], z:9.0, fit:[[-71.2598,41.0652],[-70.8294,41.2797]], date:"Aug 22, 2025",
      kicker:"First halt", title:"Stop-work, 80% built",
      sub:"Interior ordered construction stopped, citing national security",
      vis:["revwind"], act:"revwind", lines:["band","turbines"] },

    { c:[-73.1,39.2], z:5.3, fit:[[-75.559,36.901],[-70.499,41.25]], date:"Dec 22, 2025",
      kicker:"A coastwide halt", title:"One of five",
      sub:"A second, broader order also hit four sibling projects",
      vis:["revwind","coastalva","empire","sunrise","vineyard"], act:null, lines:[] },

    { c:[-73.1,39.2], z:5.3, fit:[[-75.559,36.901],[-70.499,41.25]],
      kicker:"Jan–Feb 2026", title:"Courts said no. Twice.",
      sub:"Judges called the security rationale likely pretextual; reinstated all five",
      vis:["revwind","coastalva","empire","sunrise","vineyard"], act:"revwind", lines:[] },

    { c:[-71.10,41.18], z:8.6, fit:[[-71.2598,41.0652],[-70.8294,41.2797]], date:"March 2026 →",
      kicker:"Steel outlasted the order", title:"Delivering power",
      sub:"Feeding New England's grid; full commercial operation expected this year",
      vis:["revwind"], act:"revwind", lines:["band","turbines"] }
  ];

  // ---- State ----------------------------------------------------------------
  var idx = 0;
  var map = null;
  var markers = {};
  var linesReady = false;

  var el = {
    date:    document.getElementById("tsu-date"),
    dots:    document.getElementById("tsu-dots"),
    kicker:  document.getElementById("tsu-kicker"),
    title:   document.getElementById("tsu-title"),
    sub:     document.getElementById("tsu-sub"),
    legRows: Array.prototype.slice.call(document.querySelectorAll(".reel-leg-row"))
  };

  // Beat-indicator dots (one per beat), styled by the shared frame.
  var dotsUI = TSUReel.dots(el.dots, BEATS.length);

  // ---- Map ------------------------------------------------------------------
  function initMap() {
    if (!window.maplibregl) { setTimeout(initMap, 120); return; }
    var div = document.getElementById("tsu-map");
    if (!div || map) return;

    var b0 = BEATS[0];
    map = new maplibregl.Map(TSUReel.mapOptions(div, { style: STYLE, center: b0.c, zoom: b0.z }));

    map.on("style.load", function () {
      try { map.setProjection({ type: "globe" }); } catch (e) {}
      try {
        map.setSky({
          "sky-color":"#0a1019", "horizon-color":"#1a2436", "fog-color":"#0d1420",
          "sky-horizon-blend":0.5, "horizon-fog-blend":0.6, "fog-ground-blend":0.4
        });
      } catch (e) {}
      buildBand();
      buildDots();
      buildMarkers();
      TSUReel.attachMap(map);
      TSUReel.solveAll(map, BEATS);
      applyBeat(idx, false);
    });
  }

  // Lease polygon as a filled layer, drawn first so it sits beneath the
  // turbine dots and the pins. Starts hidden; faded in per beat.
  function buildBand() {
    map.addSource("band", {
      type: "geojson",
      data: { type:"Feature", geometry:{ type:"Polygon", coordinates:BAND.coords } }
    });
    map.addLayer({ id:"band-fill", type:"fill", source:"band",
      paint:{ "fill-color":BAND.color, "fill-opacity":0 } });
    map.addLayer({ id:"band-outline", type:"line", source:"band",
      paint:{ "line-color":BAND.color, "line-width":1.2, "line-opacity":0 } });
  }

  // Turbine field as a small circle layer (a scattered point field has no
  // earlier precedent in this reel format — lobito used lines, eclipse used a
  // path band). Starts hidden; faded in per beat alongside the lease band.
  function buildDots() {
    var D = DOTS.turbines;
    var fc = { type:"FeatureCollection", features: D.coords.map(function (c) {
      return { type:"Feature", geometry:{ type:"Point", coordinates:c }, properties:{} };
    }) };
    map.addSource("dots-turbines", { type:"geojson", data: fc });
    map.addLayer({ id:"dots-turbines", type:"circle", source:"dots-turbines",
      paint:{ "circle-radius":D.radius, "circle-color":D.color, "circle-opacity":0,
        "circle-stroke-width":0.5, "circle-stroke-color":"rgba(255,255,255,.3)", "circle-stroke-opacity":0 } });
    linesReady = true;
  }

  function buildMarkers() {
    Object.keys(PINS).forEach(function (id) {
      var p = PINS[id];
      var wrap = document.createElement("div");
      wrap.className = "tsu-mk";
      wrap.style.color = COL[p.color] || COL.gold;

      var ring = document.createElement("div");
      ring.className = "tsu-ring";
      ring.style.display = "none";

      var dot = document.createElement("div");
      dot.className = "tsu-dot";

      wrap.appendChild(ring);
      wrap.appendChild(dot);

      var marker = new maplibregl.Marker({ element: wrap }).setLngLat([p.lng, p.lat]);
      markers[id] = { ring: ring, marker: marker, added: false };
    });
  }

  function applyBeat(i, fly) {
    var b = BEATS[i];
    if (map) {
      var cam = b.cam || { center: b.c, zoom: b.z };   // solved by the frame so the subject sits in the map window
      if (fly) map.flyTo({ center: cam.center, zoom: cam.zoom, duration: 1600, essential: true, curve: 1.3 });
      else     map.jumpTo({ center: cam.center, zoom: cam.zoom });
    }
    // Pins.
    Object.keys(markers).forEach(function (id) {
      var m = markers[id];
      var on = b.vis.indexOf(id) !== -1;
      if (on && !m.added) { m.marker.addTo(map); m.added = true; }
      else if (!on && m.added) { m.marker.remove(); m.added = false; }
      m.ring.style.display = (on && b.act === id) ? "block" : "none";
    });
    // Lease polygon + turbine field (fade via paint-property transition).
    if (linesReady) {
      var bandOn = b.lines.indexOf("band") !== -1;
      map.setPaintProperty("band-fill", "fill-opacity", bandOn ? BAND.op : 0);
      map.setPaintProperty("band-outline", "line-opacity", bandOn ? 0.55 : 0);
      var dotsOn = b.lines.indexOf("turbines") !== -1;
      map.setPaintProperty("dots-turbines", "circle-opacity", dotsOn ? DOTS.turbines.op : 0);
      map.setPaintProperty("dots-turbines", "circle-stroke-opacity", dotsOn ? 1 : 0);   // the ring fades with the dot
    }
    // Legend rows track whichever layers are showing.
    el.legRows.forEach(function (row) {
      row.classList.toggle("on", b.lines.indexOf(row.getAttribute("data-line")) !== -1);
    });
  }

  // ---- Overlay --------------------------------------------------------------
  function render() {
    var b = BEATS[idx];
    var last = BEATS.length - 1;

    el.kicker.textContent = b.kicker || "";
    el.title.textContent  = b.title || "";
    el.sub.textContent    = b.sub || "";

    var showDate = SHOW_DATE && !!b.date;
    el.date.hidden = !showDate;
    el.date.textContent = showDate ? b.date : "";

    TSUReel.setCounter(idx === 0 ? "Cold open" : ("Beat " + idx + " / " + last));

    dotsUI.set(idx);
  }

  function step(dir) {
    var i = idx + dir;
    if (i >= BEATS.length) i = 0;
    if (i < 0) i = 0;
    idx = i;
    render();
    applyBeat(idx, true);
  }

  render();
  initMap();

  TSUReel.bind({
    count: BEATS.length,
    step: step,
    jump: function (i) { idx = i; render(); applyBeat(idx, false); },
    mapReady: function () { return !!map && map.loaded(); },
    map: function () { return map; },
    beat: function () { return BEATS[idx]; }
  });
})();
</script>
</body>
</html>
