<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Home Screen web app: opened from the icon it runs full screen, with no browser bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSU Studio">
<meta name="theme-color" content="#0a0f18">
<!-- Shown on the reels index, which lists reels newest first. -->
<meta name="tsu-published" content="2026-08-09">
<title>Story Beat Reel: The Lobito Corridor · The Spatial Update</title>

<!--
  Story Beat Reel: a 9:16, screen-recordable map reel of "The Lobito Corridor" story.
  Standalone page: token-free MapLibre GL + Carto dark-matter tiles, so it renders
  (and records) anywhere. No build step, no Mapbox token. Open it in a browser and
  screen-record the phone screen at 9:16 while narrating.

  Layout: this reel uses the shared frame (reel-frame.css + reel-frame.js): one
  fixed 1080x1920 stage, scaled to fit the screen, with the safe zone and the
  layout bands (header row, map window, legend, text block) defined once in
  reel-frame.css. Add ?guides=1 (or press G) to shade the blocked areas, outline
  the safe area and mark the bands. `npm run check-reels` fails if any beat breaks
  the layout rules. Each beat's `fit` lists the points of its subject; the frame
  zooms and positions the map so they sit inside the map window.

  Controls: tap/click the right ~2/3 of the screen (or press -> / Space) to
  advance a beat, the left ~1/3 (or <-) to go back. Hold a finger down for a second
  to go back to the reels index. Nothing else is ever drawn on screen.


  Beats, pins and rail lines mirror src/stories/lobito-corridor/: keep them in sync
  if the story data changes. Coordinates here are [lng, lat] to match MapLibre / the
  GeoJSON spec. (This story's spine is the RAIL LINES, so this reel adds line layers
  to the pin-only format used by iran-strikes.html.)
-->

<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

<link href="reel-frame.css" rel="stylesheet">
</head>
<body>
<div class="reel-stage" id="reel-stage">
  <div id="tsu-map"></div>

  <div class="reel-scrim"></div>

  <div class="reel-header">
    <div class="reel-date" id="tsu-date" hidden></div>
    <div class="reel-dots" id="tsu-dots"></div>
  </div>

  <div class="reel-legend" id="tsu-legend">
    <div class="reel-leg-row" data-line="corridor"><span class="reel-leg-line" style="border-top-color:#e8c87a"></span>Lobito Corridor</div>
    <div class="reel-leg-row" data-line="extension"><span class="reel-leg-line" style="border-top-color:#e8c87a;border-top-style:dashed"></span>Planned Zambia link</div>
    <div class="reel-leg-row" data-line="tazara"><span class="reel-leg-line" style="border-top-color:#5b9bd5;border-top-style:dashed"></span>TAZARA</div>
    <div class="reel-leg-row" data-line="feeder"><span class="reel-leg-line" style="border-top-color:#9a958c;border-top-style:dashed"></span>Copperbelt feeder</div>
  </div>

  <div class="reel-caption">
    <div class="reel-kicker" id="tsu-kicker"></div>
    <div class="reel-title"  id="tsu-title"></div>
    <div class="reel-sub"    id="tsu-sub"></div>
  </div>
</div>

<script src="reel-frame.js"></script>
<script>
(function () {
  "use strict";

  // ---- Story data (mirrors src/stories/lobito-corridor/) --------------------
  var STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
  var COL = { gold:"#e8c87a", red:"#e05a4e", teal:"#3ecfb2", blue:"#5b9bd5", slate:"#9a958c" };

  // Pins are [lng, lat]: GeoJSON / MapLibre order.
  // Colour codes the narrative: gold = west/Atlantic/Lobito, blue = east/Indian
  // Ocean/TAZARA, red = the ore itself (the Copperbelt), slate = the Kapiri
  // Mposhi junction where the ore transfers onto TAZARA.
  var PINS = {
    lobito:   { lng:13.5464, lat:-12.35,   color:"gold"  },
    kolwezi:  { lng:25.485,  lat:-10.73,   color:"red"   },
    chingola: { lng:27.85,   lat:-12.533,  color:"red"   },
    kapiri:   { lng:28.685,  lat:-13.977,  color:"slate" },
    dar:      { lng:39.28,   lat:-6.816,   color:"blue"  }
  };

  // Rail lines: coordinates lifted from src/stories/lobito-corridor/data.geojson.
  // TAZARA begins at the Kapiri Mposhi junction, not at the mines; the "feeder"
  // is the separate Zambia Railways link that brings Copperbelt ore down to it.
  var LINES = {
    corridor: { color:COL.gold,  width:3,   dash:null,   op:0.95, coords:[
      [13.5464,-12.35],[13.407,-12.578],[15.739,-12.776],[16.933,-12.383],
      [19.917,-11.783],[21.65,-11.217],[22.2247,-10.7073],[22.335,-10.712],[25.485,-10.73] ] },
    extension:{ color:COL.gold,  width:2,   dash:[2,2],  op:0.7,  coords:[
      [21.65,-11.217],[24.25,-11.15],[27.85,-12.533] ] },
    tazara:   { color:COL.blue,  width:2.5, dash:[3,2],  op:0.85, coords:[
      [28.685,-13.977],[31.433,-11.850],[32.758,-9.327],[33.46,-8.9],
      [34.83,-8.85],[36.98,-7.70],[39.28,-6.816] ] },
    feeder:   { color:COL.slate, width:1.8, dash:[2,2],  op:0.7,  coords:[
      [27.85,-12.533],[28.633,-12.968],[28.685,-13.977] ] }
  };
  var LINE_IDS = Object.keys(LINES);

  // Each beat: c / z = the map centre [lng, lat] and the closest zoom it may use;
  // fit = the points of the beat's subject, which the frame fits inside the map
  // window (it zooms out below z if it has to); act = the pin that pulses; lines =
  // the rail lines drawn, and the legend shows one row for each (never more than 3).
  // On-screen text: a kicker, a headline (7 words), one supporting line (10 words).
  // fit points: Kolwezi, Chingola, Kapiri Mposhi, Dar es Salaam, Lobito, and a point on the planned Zambia link.
  var BEATS = [
    { c:[24.0,-11.0], z:3.3, fit:[[25.485,-10.73],[27.85,-12.533]],
      kicker:"The Spatial Update", title:"The Lobito Corridor", sub:"Which ocean Africa's copper flows to",
      vis:["kolwezi","chingola"], act:"kolwezi", lines:[] },

    { c:[26.5,-11.4], z:4.5, fit:[[25.485,-10.73],[27.85,-12.533]],
      kicker:"The Copperbelt", title:"A landlocked treasure", sub:"The DRC alone mines about 72% of the world's cobalt",
      vis:["kolwezi","chingola"], act:"chingola", lines:[] },

    { c:[33.0,-9.4], z:3.4, fit:[[25.485,-10.73],[27.85,-12.533],[28.685,-13.977],[39.28,-6.816]], date:"Since the 1970s",
      kicker:"The old way: east", title:"Out to the Indian Ocean", sub:"Ore has ridden China's TAZARA railway to Dar es Salaam",
      vis:["kolwezi","chingola","dar","kapiri"], act:"dar", lines:["tazara","feeder"] },

    { c:[19.5,-11.6], z:4.0, fit:[[13.5464,-12.35],[25.485,-10.73],[27.85,-12.533],[28.685,-13.977]], date:"2024–26",
      kicker:"The new bet: west", title:"Back to the Atlantic", sub:"A US- and EU-backed railway now pulls it to Lobito",
      vis:["kolwezi","chingola","dar","kapiri","lobito"], act:"lobito", lines:["tazara","feeder","corridor"] },

    { c:[24.0,-11.7], z:4.2, fit:[[13.5464,-12.35],[25.485,-10.73],[24.25,-11.15],[27.85,-12.533]],
      kicker:"The missing link", title:"A new line for Zambia", sub:"A planned extension would wire the Copperbelt into the corridor",
      vis:["kolwezi","chingola","dar","kapiri","lobito"], act:"chingola", lines:["tazara","corridor","extension"] },

    { c:[26.0,-10.3], z:3.1, fit:[[13.5464,-12.35],[39.28,-6.816],[28.685,-13.977],[27.85,-12.533]],
      kicker:"Two oceans, two blocs", title:"One belt, pulled both ways", sub:"West to the Atlantic or east to the Indian Ocean",
      vis:["kolwezi","chingola","dar","kapiri","lobito"], act:null, lines:["tazara","feeder","corridor"] }
  ];

  // showDate can be turned off with ?date=off for a cleaner recording.
  var params = new URLSearchParams(window.location.search);
  var SHOW_DATE = params.get("date") !== "off";

  // ---- State ----------------------------------------------------------------
  var idx = 0;
  var map = null;
  var markers = {};
  var linesReady = false;

  var el = {
    date:    document.getElementById("tsu-date"),
    dots:    document.getElementById("tsu-dots"),
    kicker:  document.getElementById("tsu-kicker"),
    title:   document.getElementById("tsu-title"),
    sub:     document.getElementById("tsu-sub"),
    legRows: Array.prototype.slice.call(document.querySelectorAll(".reel-leg-row"))
  };

  // Beat-indicator dots (one per beat), styled by the shared frame.
  var dotsUI = TSUReel.dots(el.dots, BEATS.length);

  // ---- Map ------------------------------------------------------------------
  function initMap() {
    if (!window.maplibregl) { setTimeout(initMap, 120); return; }
    var div = document.getElementById("tsu-map");
    if (!div || map) return;

    var b0 = BEATS[0];
    map = new maplibregl.Map(TSUReel.mapOptions(div, { style: STYLE, center: b0.c, zoom: b0.z }));

    map.on("style.load", function () {
      try { map.setProjection({ type: "globe" }); } catch (e) {}
      try {
        map.setSky({
          "sky-color":"#0a1019", "horizon-color":"#1a2436", "fog-color":"#0d1420",
          "sky-horizon-blend":0.5, "horizon-fog-blend":0.6, "fog-ground-blend":0.4
        });
      } catch (e) {}
      buildLines();
      buildMarkers();
      TSUReel.attachMap(map);
      TSUReel.solveAll(map, BEATS);
      applyBeat(idx, false);
    });
  }

  // Rail lines as GeoJSON line layers, each starting hidden (opacity 0) and
  // faded in per beat. Drawn before the markers so pins sit on top of the track.
  function buildLines() {
    LINE_IDS.forEach(function (id) {
      var L = LINES[id];
      var src = "line-" + id;
      map.addSource(src, {
        type: "geojson",
        data: { type:"Feature", geometry:{ type:"LineString", coordinates:L.coords } }
      });
      var paint = { "line-color":L.color, "line-width":L.width, "line-opacity":0 };
      if (L.dash) paint["line-dasharray"] = L.dash;
      map.addLayer({
        id: src, type:"line", source:src,
        layout:{ "line-cap":"round", "line-join":"round" },
        paint: paint
      });
    });
    linesReady = true;
  }

  function buildMarkers() {
    Object.keys(PINS).forEach(function (id) {
      var p = PINS[id];
      var wrap = document.createElement("div");
      wrap.className = "tsu-mk";
      wrap.style.color = COL[p.color] || COL.gold;

      var ring = document.createElement("div");
      ring.className = "tsu-ring";
      ring.style.display = "none";

      var dot = document.createElement("div");
      dot.className = "tsu-dot";

      wrap.appendChild(ring);
      wrap.appendChild(dot);

      var marker = new maplibregl.Marker({ element: wrap }).setLngLat([p.lng, p.lat]);
      markers[id] = { ring: ring, marker: marker, added: false };
    });
  }

  function applyBeat(i, fly) {
    var b = BEATS[i];
    if (map) {
      var cam = b.cam || { center: b.c, zoom: b.z };   // solved by the frame so the subject sits in the map window
      if (fly) map.flyTo({ center: cam.center, zoom: cam.zoom, duration: 1600, essential: true, curve: 1.3 });
      else     map.jumpTo({ center: cam.center, zoom: cam.zoom });
    }
    // Pins.
    Object.keys(markers).forEach(function (id) {
      var m = markers[id];
      var on = b.vis.indexOf(id) !== -1;
      if (on && !m.added) { m.marker.addTo(map); m.added = true; }
      else if (!on && m.added) { m.marker.remove(); m.added = false; }
      m.ring.style.display = (on && b.act === id) ? "block" : "none";
    });
    // Rail lines (fade via paint-property transition).
    if (linesReady) {
      LINE_IDS.forEach(function (id) {
        var on = b.lines.indexOf(id) !== -1;
        map.setPaintProperty("line-" + id, "line-opacity", on ? LINES[id].op : 0);
      });
    }
    // Legend rows track whichever lines are showing.
    el.legRows.forEach(function (row) {
      row.classList.toggle("on", b.lines.indexOf(row.getAttribute("data-line")) !== -1);
    });
  }

  // ---- Overlay --------------------------------------------------------------
  function render() {
    var b = BEATS[idx];
    var last = BEATS.length - 1;

    el.kicker.textContent = b.kicker || "";
    el.title.textContent  = b.title || "";
    el.sub.textContent    = b.sub || "";

    var showDate = SHOW_DATE && !!b.date;
    el.date.hidden = !showDate;
    el.date.textContent = showDate ? b.date : "";

    TSUReel.setCounter(idx === 0 ? "Cold open" : ("Beat " + idx + " / " + last));

    dotsUI.set(idx);
  }

  function step(dir) {
    var i = idx + dir;
    if (i >= BEATS.length) i = 0;
    if (i < 0) i = 0;
    idx = i;
    render();
    applyBeat(idx, true);
  }

  render();
  initMap();

  TSUReel.bind({
    count: BEATS.length,
    step: step,
    jump: function (i) { idx = i; render(); applyBeat(idx, false); },
    mapReady: function () { return !!map && map.loaded(); },
    map: function () { return map; },
    beat: function () { return BEATS[idx]; }
  });
})();
</script>
</body>
</html>
