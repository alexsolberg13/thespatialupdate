<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Posts · The Spatial Update</title>

<!--
  Posts index: every Instagram slide post, newest first.
  THIS IS A TEMPLATE. The real page (docs/posts/index.html) is built from it by
  scripts/posts_index.js every time Eleventy builds, from the posts that exist in
  src/posts/<slug>/. Nothing to edit when you add a post: give its index.html a
  <meta name="tsu-published" content="YYYY-MM-DD"> and a
  <meta name="tsu-slides" content="N"> and it appears on its own.
  Each post's page shows its slide images (press and hold to save on iPhone) and its
  caption with a copy button.
-->

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#0a0f18; }
  body { min-height:100vh; background:#0a0f18; color:#f2efe9; font-family:Georgia,serif; -webkit-font-smoothing:antialiased;
         -webkit-tap-highlight-color:transparent;
         padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px); }
  main { max-width:520px; margin:0 auto; }
  .back { display:inline-flex; align-items:center; min-height:44px; font:700 12px/1 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#c8a84e; text-decoration:none; margin-bottom:10px; }
  h1 { font:400 28px/1.2 Georgia,serif; margin-bottom:6px; }
  .lede { font:400 14px/1.5 Arial,sans-serif; color:#8a8681; margin-bottom:26px; }
  h2 { font:700 11px/1 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#c8a84e; margin:26px 0 12px; }
  .row { display:flex; gap:16px; align-items:center; text-decoration:none; color:inherit; background:#141a26; border:1px solid #232b3a; border-radius:12px; padding:14px; margin-bottom:10px; }
  .row:active { background:#1c2535; }
  .row img { width:84px; height:105px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#0a0f18; }
  .row b { display:block; font:400 20px/1.25 Georgia,serif; margin-bottom:5px; }
  .row span { font:400 13px/1.4 Arial,sans-serif; color:#8a8681; }
  .hint { font:400 12px/1.5 Arial,sans-serif; color:#6f6b66; margin-top:30px; }
</style>
</head>
<body>
<main>
  <a class="back" href="../studio/index.html">&larr; Studio</a>
  <h1>Posts</h1>
  <p class="lede">Instagram slide posts. Open one to save its slides to your phone and copy its caption.</p>

  <h2>Posts, newest first</h2>
  <a class="row" href="lake-powell/index.html"><img src="lake-powell/slides/01.png" alt="" width="84" height="105"><div><b>Lake Powell</b><span>Published 3 Oct 2026 · 8 slides</span></div></a>

  <p class="hint">On iPhone: open a post, press and hold a slide, then tap Save to Photos.</p>
</main>
</body>
</html>
