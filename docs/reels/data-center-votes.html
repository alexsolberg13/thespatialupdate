<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<!-- Home Screen web app: opened from the icon it runs full screen, with no browser bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSU Studio">
<meta name="theme-color" content="#0a0f18">
<!-- Shown on the reels index, which lists reels newest first. -->
<meta name="tsu-published" content="2026-10-04">
<title>Story Beat Reel — Data Center Votes · The Spatial Update</title>

<!--
  Story Beat Reel: five local data center votes, September 28 to 30, 2026. Standalone page:
  token-free MapLibre GL + Carto dark-matter tiles, so it renders (and records) anywhere.

  Layout: this reel uses the shared frame (reel-frame.css + reel-frame.js). Add ?guides=1
  (or press G) to show the bands. `npm run check-reels` fails if any beat breaks the layout
  rules. Each beat's `fit` lists the points of its subject.

  Controls: tap the right ~2/3 of the screen to advance, the left ~1/3 to go back. Hold a
  finger down for a second to go back to the reels index.

  DRAFT. Every number and place here traces to dossiers/data-center-votes.md (the source
  record); the narration script is src/reels/data-center-votes-script.md.

  The GeoJSON below is a copy of src/reels/data-center-votes-data.geojson (five points:
  Census Gazetteer place centroids, and the E.W. Brown plant from OpenStreetMap). The pins
  mark the town or plant, not the exact project site. Keep the two in sync. Coordinates
  are [lng, lat].
-->

<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

<link href="reel-frame.css" rel="stylesheet">
<style>
  /* Data center votes only: a label is shown on the beat it belongs to. It is hidden with
     visibility, not opacity: MapLibre writes an inline opacity on every marker. */
  .tsu-lbl { visibility:hidden; }
  .tsu-lbl.on { visibility:visible; }
</style>
</head>
<body>
<div class="reel-stage" id="reel-stage">
  <div id="tsu-map"></div>

  <div class="reel-scrim"></div>

  <div class="reel-header">
    <div class="reel-date" id="tsu-date" hidden></div>
    <div class="reel-dots" id="tsu-dots"></div>
  </div>

  <div class="reel-legend" id="tsu-legend">
    <div class="reel-leg-row" data-line="ok"><span class="reel-leg-dot" style="background:#5b9bd5"></span>Approved</div>
    <div class="reel-leg-row" data-line="no"><span class="reel-leg-dot" style="background:#e8955a"></span>Rejected, banned or paused</div>
  </div>

  <div class="reel-caption">
    <div class="reel-kicker" id="tsu-kicker"></div>
    <div class="reel-title"  id="tsu-title"></div>
    <div class="reel-sub"    id="tsu-sub"></div>
  </div>
</div>

<script src="reel-frame.js"></script>
<script>
(function () {
  "use strict";

  // ---- Story data (mirrors src/reels/data-center-votes-data.geojson) --------
  var STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
  var COL = { ok:"#5b9bd5", no:"#e8955a" };

  var DATA = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"id":"cheyenne","name":"Cheyenne, Wyoming","label":"Cheyenne","status":"approved","position_source":"Census Gazetteer 2023 place centroid (Cheyenne city)"},"geometry":{"type":"Point","coordinates":[-104.7902,41.1273]}},{"type":"Feature","properties":{"id":"kline","name":"Kline Township, Pennsylvania","label":"Kline Twp.","status":"approved","position_source":"Census Gazetteer 2023 county subdivision centroid (Kline township, Schuylkill County)"},"geometry":{"type":"Point","coordinates":[-76.0504,40.8785]}},{"type":"Feature","properties":{"id":"lovejoy","name":"Lovejoy, Georgia","label":"Lovejoy","status":"blocked","position_source":"Census Gazetteer 2023 place centroid (Lovejoy city)"},"geometry":{"type":"Point","coordinates":[-84.3174,33.4415]}},{"type":"Feature","properties":{"id":"mercer","name":"E.W. Brown Generating Station, Mercer County, Kentucky","label":"E.W. Brown plant","status":"blocked","position_source":"OpenStreetMap way 449254194 (via Nominatim), centre of the plant's industrial area"},"geometry":{"type":"Point","coordinates":[-84.7123,37.7906]}},{"type":"Feature","properties":{"id":"palmsprings","name":"Palm Springs, California","label":"Palm Springs","status":"blocked","position_source":"Census Gazetteer 2023 place centroid (Palm Springs city)"},"geometry":{"type":"Point","coordinates":[-116.5383,33.8034]}}]};

  var PINS = {};
  DATA.features.forEach(function (f) {
    PINS[f.properties.id] = { lng:f.geometry.coordinates[0], lat:f.geometry.coordinates[1],
                              color: f.properties.status === "approved" ? "ok" : "no", label:f.properties.label };
  });

  var params = new URLSearchParams(window.location.search);
  var SHOW_DATE = params.get("date") !== "off";

  // Each beat: c / z = the map centre [lng, lat] and the closest zoom it may use;
  // fit = the points of the beat's subject; vis = the pins shown; act = the pin that
  // pulses; lbl = the pins whose name is shown; legend = the legend rows (never more than 3).
  var BEATS = [
    { c:[-96,38], z:4, fit:[[-116.54,33.80],[-76.05,40.88],[-104.79,41.13],[-84.32,33.44],[-84.71,37.79]], date:"Sep 28 to 30, 2026",
      kicker:"Data center votes", title:"Five votes in three days",
      sub:"Two approvals, a ban, a pause and a rejection",
      vis:["cheyenne","kline","lovejoy","mercer","palmsprings"], act:null, lbl:["cheyenne","kline","lovejoy","mercer","palmsprings"], legend:["ok","no"] },

    { c:[-104.79,41.13], z:6, fit:[[-104.79,41.13]], date:"Sep 28, 2026",
      kicker:"Cheyenne, Wyoming", title:"1,260 acres added for a data center",
      sub:"The council voted 8 to 2 on September 28",
      vis:["cheyenne"], act:"cheyenne", lbl:[], legend:["ok"] },

    { c:[-76.05,40.88], z:6, fit:[[-76.05,40.88]], date:"Sep 30, 2026",
      kicker:"Kline Township, Pennsylvania", title:"Amazon's 350-acre campus is approved",
      sub:"Supervisors voted unanimously, with blasting and noise conditions",
      vis:["kline"], act:"kline", lbl:[], legend:["ok"] },

    { c:[-84.32,33.44], z:6, fit:[[-84.32,33.44]], date:"Sep 28, 2026",
      kicker:"Lovejoy, Georgia", title:"A $1 billion plan, then a ban",
      sub:"The developer withdrew in August; the city banned data centers",
      vis:["lovejoy"], act:"lovejoy", lbl:[], legend:["no"] },

    { c:[-84.71,37.79], z:6, fit:[[-84.71,37.79]], date:"Sep 28, 2026",
      kicker:"Mercer County, Kentucky", title:"Zoning next to a coal plant rejected",
      sub:"The vote was unanimous; no project had been proposed",
      vis:["mercer"], act:"mercer", lbl:["mercer"], legend:["no"] },

    { c:[-116.54,33.80], z:6, fit:[[-116.54,33.80]], date:"Sep 30, 2026",
      kicker:"Palm Springs, California", title:"A pause through August 2028",
      sub:"The city has no data center rules yet",
      vis:["palmsprings"], act:"palmsprings", lbl:[], legend:["no"] }
  ];

  // ---- State ----------------------------------------------------------------
  var idx = 0;
  var map = null;
  var markers = {};
  var labelEls = {};

  var el = {
    date:    document.getElementById("tsu-date"),
    dots:    document.getElementById("tsu-dots"),
    kicker:  document.getElementById("tsu-kicker"),
    title:   document.getElementById("tsu-title"),
    sub:     document.getElementById("tsu-sub"),
    legRows: Array.prototype.slice.call(document.querySelectorAll(".reel-leg-row"))
  };
  var dotsUI = TSUReel.dots(el.dots, BEATS.length);

  // ---- Map ------------------------------------------------------------------
  function initMap() {
    if (!window.maplibregl) { setTimeout(initMap, 120); return; }
    var div = document.getElementById("tsu-map");
    if (!div || map) return;

    var b0 = BEATS[0];
    map = new maplibregl.Map(TSUReel.mapOptions(div, { style: STYLE, center: b0.c, zoom: b0.z }));

    map.on("style.load", function () {
      try { map.setProjection({ type: "globe" }); } catch (e) {}
      try {
        map.setSky({
          "sky-color":"#0a1019", "horizon-color":"#1a2436", "fog-color":"#0d1420",
          "sky-horizon-blend":0.5, "horizon-fog-blend":0.6, "fog-ground-blend":0.4
        });
      } catch (e) {}
      buildMarkers();
      TSUReel.attachMap(map);
      TSUReel.solveAll(map, BEATS);
      applyBeat(idx, false);
    });
  }

  function buildMarkers() {
    Object.keys(PINS).forEach(function (id) {
      var p = PINS[id];
      var wrap = document.createElement("div");
      wrap.className = "tsu-mk";
      wrap.style.color = COL[p.color];
      var ring = document.createElement("div");
      ring.className = "tsu-ring";
      ring.style.display = "none";
      var dot = document.createElement("div");
      dot.className = "tsu-dot";
      wrap.appendChild(ring);
      wrap.appendChild(dot);
      var marker = new maplibregl.Marker({ element: wrap }).setLngLat([p.lng, p.lat]).addTo(map);
      wrap.style.display = "none";
      markers[id] = { ring: ring, wrap: wrap, marker: marker };

      var d = document.createElement("div");
      d.className = "reel-maplabel tsu-lbl";   // the frame hides it under the text block
      d.textContent = p.label;
      new maplibregl.Marker({ element: d, offset:[0, -20] }).setLngLat([p.lng, p.lat]).addTo(map);
      labelEls[id] = d;
    });
  }

  function applyBeat(i, fly) {
    var b = BEATS[i];
    if (map) {
      var cam = b.cam || { center: b.c, zoom: b.z };   // solved by the frame so the subject sits in the map window
      if (fly) map.flyTo({ center: cam.center, zoom: cam.zoom, duration: 1600, essential: true, curve: 1.3 });
      else     map.jumpTo({ center: cam.center, zoom: cam.zoom });
    }
    Object.keys(markers).forEach(function (id) {
      var m = markers[id];
      var on = b.vis.indexOf(id) !== -1;
      m.wrap.style.display = on ? "block" : "none";
      m.ring.style.display = (on && b.act === id) ? "block" : "none";
      labelEls[id].classList.toggle("on", b.lbl.indexOf(id) !== -1);
    });
    el.legRows.forEach(function (row) {
      var k = row.getAttribute("data-line");
      row.classList.toggle("on", b.legend.indexOf(k) !== -1);
    });
  }

  // ---- Overlay --------------------------------------------------------------
  function render() {
    var b = BEATS[idx];
    var last = BEATS.length - 1;

    el.kicker.textContent = b.kicker || "";
    el.title.textContent  = b.title || "";
    el.sub.textContent    = b.sub || "";

    var showDate = SHOW_DATE && !!b.date;
    el.date.hidden = !showDate;
    el.date.textContent = showDate ? b.date : "";

    TSUReel.setCounter(idx === 0 ? "Cold open" : ("Beat " + idx + " / " + last));

    dotsUI.set(idx);
  }

  function step(dir) {
    var i = idx + dir;
    if (i >= BEATS.length) i = 0;
    if (i < 0) i = 0;
    idx = i;
    render();
    applyBeat(idx, true);
  }

  render();
  initMap();

  TSUReel.bind({
    count: BEATS.length,
    step: step,
    jump: function (i) { idx = i; render(); applyBeat(idx, false); },
    mapReady: function () { return !!map && map.loaded(); },
    map: function () { return map; },
    beat: function () { return BEATS[idx]; }
  });
})();
</script>
</body>
</html>
